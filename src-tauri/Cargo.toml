[package]
name = "castaway"
version = "0.1.0"
description = "Castaway: Windows tray app wrapping UxPlay"
authors = ["Castaway contributors"]
edition = "2024"
default-run = "castaway"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "castaway_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Gates the fake_uxplay test helper binary so it is not bundled into the installer.
test-helpers = []

[[bin]]
name = "castaway"
path = "src/main.rs"

[[bin]]
name = "fake_uxplay"
path = "src/bin/fake_uxplay.rs"
required-features = ["test-helpers"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
win32job = "2.1.0"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[dev-dependencies]
# Self dev-dependency enables the test-helpers feature for `cargo test`.
castaway = { path = ".", package = "castaway", features = ["test-helpers"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
